<div class="afd" id="afd">
  <div class="afd-label default-question-text-size">{{{LABEL}}}</div>
  <div class="afd-hint default-hint-text-size">{{{HINT}}}</div>
  <div class="afd-row">
    <label class="afd-part">
      <span class="afd-cap default-hint-text-size" id="cap-day"></span>
      <select id="sel-day" class="default-answer-text-size"></select>
    </label>
    <label class="afd-part afd-part-month">
      <span class="afd-cap default-hint-text-size" id="cap-month"></span>
      <select id="sel-month" class="default-answer-text-size"></select>
    </label>
    <label class="afd-part">
      <span class="afd-cap default-hint-text-size" id="cap-year"></span>
      <select id="sel-year" class="default-answer-text-size"></select>
    </label>
  </div>
  <p class="afd-echo default-hint-text-size" id="echo" aria-live="polite"></p>
  <div class="afd-actions">
    <button type="button" id="btn-today" class="afd-btn default-answer-text-size"></button>
    <button type="button" id="btn-clear" class="afd-btn afd-btn-quiet default-answer-text-size"></button>
  </div>
</div>
